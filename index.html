<!doctype html>
<html lang="en" data-gate="closed">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Anya is turning ONE · 10 October 2026</title>
    <meta
      name="description"
      content="You're invited to Anya's first birthday. Saturday 10 October 2026, 2:00 to 6:00 in the afternoon, at Bantug Lake Ranch."
    />

    <!--
      This invitation is shared into a group chat as often as it is opened directly, so
      the link preview is a first impression rather than an afterthought.

      What used to be here pointed at one of the site's own optimized photographs, and
      that is why Messenger drew a bare grey link with nothing on it but the domain:
      Facebook and Messenger do not read WebP, so the image fetch simply failed and the
      card had nothing to show. Three rules, none of them optional:

      1. A JPEG or a PNG. Never one of the .webp or .avif derivatives, however much
         smaller they are. Those exist for browsers, and a scraper is not a browser.
      2. An absolute URL, so nothing depends on a scraper resolving a path.
      3. Declared dimensions, or the preview is laid out before the image has been
         fetched and a large card gets drawn as a small one.

      The card itself is built by tools/share/build.mjs, which renders it through the
      browser so it carries the invitation's own type, its gold and her photograph.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anya's Enchanted First Year" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:url" content="https://briella-anya-1st-birthday.vercel.app/" />
    <meta property="og:title" content="Anya is turning ONE" />
    <meta
      property="og:description"
      content="Saturday, 10 October 2026 · 2:00 – 6:00 in the afternoon · Bantug Lake Ranch. Come and celebrate a magical first year with us."
    />
    <meta
      property="og:image"
      content="https://briella-anya-1st-birthday.vercel.app/invitation/share/anya-share.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://briella-anya-1st-birthday.vercel.app/invitation/share/anya-share.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anya is turning one. Saturday, 10 October 2026, 2:00 to 6:00 in the afternoon, at Bantug Lake Ranch."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anya is turning ONE" />
    <meta
      name="twitter:description"
      content="Saturday, 10 October 2026 · 2:00 – 6:00 in the afternoon · Bantug Lake Ranch."
    />
    <meta
      name="twitter:image"
      content="https://briella-anya-1st-birthday.vercel.app/invitation/share/anya-share.jpg"
    />

    <!--
      The fonts are served from this origin, so there is no third-party host to warm.
      Preloading the two faces the first screen actually uses stops the name and the
      date from flashing in a fallback serif while the bundle parses.
    -->
    <!-- The three faces the first screen actually sets: display, script, body. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/great-vibes.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      The loading screen opens on a night sky, and this is what the browser paints before
      any stylesheet arrives. It is on <html> rather than <body> on purpose: <body> has to
      stay transparent so the fixed sky layer behind the page can be seen through it.
    -->
    <style>
      html {
        background: #241c3a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: Georgia, serif; text-align: center">
        <h1>Anya is turning ONE</h1>
        <p>Saturday 10 October 2026 · 2:00 – 6:00 in the afternoon<br />Bantug Lake Ranch</p>
        <p>Please turn on JavaScript to see the full invitation.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
