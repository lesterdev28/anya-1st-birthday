<!doctype html>
<!--
  The picture social apps show when the invitation is shared.

  Rendered by tools/share/build.mjs through the real browser and the real fonts rather
  than drawn with an image library, because this card has to look like the invitation it
  links to and the invitation's type is the whole look. Served from dist/, so every path
  here is the same one the site uses.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url(/fonts/cormorant-garamond.woff2) format("woff2");
        font-weight: 300 700;
      }
      @font-face {
        font-family: "DM Sans";
        src: url(/fonts/dm-sans.woff2) format("woff2");
        font-weight: 100 1000;
      }
      @font-face {
        font-family: "Great Vibes";
        src: url(/fonts/great-vibes.woff2) format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        /* The sky of the invitation's own opening, laid down flat. */
        background:
          radial-gradient(120% 90% at 22% 18%, rgba(255, 253, 248, 0.95) 0%, rgba(255, 253, 248, 0) 60%),
          linear-gradient(152deg, #fff9f1 0%, #f6ecf4 38%, #e8ddf5 68%, #f4d6df 100%);
        display: flex;
        align-items: center;
        gap: 68px;
        padding: 0 84px;
        position: relative;
      }

      /* The hairline the whole site uses, run round the edge as a printed card would. */
      .frame {
        position: absolute;
        inset: 26px;
        border: 1px solid rgba(215, 180, 106, 0.55);
        border-radius: 14px;
        pointer-events: none;
      }

      /* Kept to the corners: the type runs almost the full width and must not meet them. */
      .bloom {
        position: absolute;
        opacity: 0.42;
      }
      .bloom--left { width: 290px; left: -78px; bottom: -66px; transform: scaleX(-1); }
      .bloom--right { width: 250px; right: -76px; top: -92px; }

      .portrait {
        flex: 0 0 auto;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        box-shadow:
          0 0 0 3px rgba(255, 253, 248, 0.9),
          0 0 0 5px rgba(215, 180, 106, 0.75),
          0 26px 60px rgba(103, 88, 132, 0.26);
      }
      .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .words { position: relative; }

      .eyebrow {
        font-family: "DM Sans", sans-serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #7d5f21;
        margin-bottom: 14px;
      }

      /*
        The same five-step gold the headings on the site are filled with. It has to be a
        gradient rather than a flat yellow: one colour reads as a highlighter, and what
        makes metal look like metal is the dark band between two light ones.
      */
      .name {
        font-family: "Cormorant Garamond", serif;
        font-size: 78px;
        font-weight: 500;
        line-height: 1.06;
        letter-spacing: -0.005em;
        background-image: linear-gradient(
          168deg,
          #e8d3a4 0%, #d7b46a 16%, #b28b3c 32%, #96702f 46%,
          #85631f 53%, #b28b3c 66%, #d7b46a 82%, #fffaef 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter:
          drop-shadow(0 1px 0 rgba(255, 253, 248, 0.6))
          drop-shadow(0 3px 18px rgba(150, 112, 47, 0.24));
      }
      .name em { font-style: normal; display: block; }

      .rule {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 330px;
        margin: 26px 0 24px;
      }
      .rule::before, .rule::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, #e8d3a4, transparent);
      }
      .rule span {
        width: 7px;
        height: 7px;
        transform: rotate(45deg);
        background: #d7b46a;
      }

      .when {
        font-family: "Cormorant Garamond", serif;
        font-size: 38px;
        font-weight: 500;
        color: #453a57;
        line-height: 1.25;
      }

      .detail {
        font-family: "DM Sans", sans-serif;
        font-size: 21px;
        font-weight: 300;
        color: #625670;
        letter-spacing: 0.02em;
        margin-top: 8px;
      }

      .where {
        font-family: "DM Sans", sans-serif;
        font-size: 21px;
        font-weight: 400;
        color: #625670;
        letter-spacing: 0.02em;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <img class="bloom bloom--left" src="/invitation/art/optimized/magnolia-spray-640.webp" alt="" />
    <img class="bloom bloom--right" src="/invitation/art/optimized/magnolia-spray-640.webp" alt="" />

    <div class="portrait">
      <img src="/invitation/photos/anya-finale-portrait.jpg" alt="" />
    </div>

    <div class="words">
      <p class="eyebrow">You're Invited</p>
      <h1 class="name">Anya is turning<em>ONE</em></h1>
      <div class="rule"><span></span></div>
      <p class="when">Saturday, October 10, 2026</p>
      <p class="detail">2:00 – 6:00 in the afternoon</p>
      <p class="where">Bantug Lake Ranch</p>
    </div>
  </body>
</html>
